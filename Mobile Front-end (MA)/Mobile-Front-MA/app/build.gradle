plugins {
    alias(libs.plugins.android.application)
}

// The backend address differs per machine: the emulator reaches the host PC at
// 10.0.2.2, while a physical phone needs the PC's LAN IP. Rather than editing a
// shared source file (and committing it by accident), override it in
// local.properties, which is git-ignored:
//
//     backendUrl=http://192.168.1.113:8080/
//
// Any address used here must also be listed in res/xml/network_security_config.xml,
// because the backend speaks plain HTTP and Android blocks cleartext by default.
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
def backendUrl = localProperties.getProperty('backendUrl') ?: 'http://10.0.2.2:8080/'

android {
    namespace 'com.example.mobile_front_ma'
    compileSdk {
        version = release(36)
    }

    defaultConfig {
        applicationId "rs.ac.uns.ftn.zgazenisendvic"
        minSdk 33
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "BACKEND_URL", "\"${backendUrl}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.fragment
    implementation libs.recyclerview
    implementation libs.retrofit
    implementation libs.converter.gson
    implementation libs.okhttp.logging
    implementation libs.osmdroid
    implementation libs.mpandroidchart
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}